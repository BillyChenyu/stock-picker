name: A股云端选股和回测

on:
  schedule:
    # UTC 08:17 = 北京时间周一至周五16:17（收盘后研究，不用于尾盘实盘下单）
    - cron: '17 8 * * 1-5'
    # UTC 周日至周四19:17 = 北京时间周一至周五03:17（历史结果回填）
    - cron: '17 19 * * 0-4'
  workflow_dispatch:
    inputs:
      task:
        description: '选择要运行的任务'
        required: true
        default: pick
        type: choice
        options:
          - pick
          - backfill
          - backtest

permissions:
  contents: read

concurrency:
  group: stockpicker-state
  cancel-in-progress: false

jobs:
  stockpicker:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: '1'
      ASHAREHUB_API_KEY: ${{ secrets.ASHAREHUB_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 从此前运行恢复历史数据库及报告
        uses: actions/cache/restore@v4
        with:
          key: stockpicker-state-${{ github.run_id }}
          restore-keys: |
            stockpicker-state-
          path: |
            data/db/
            data/cache/*.db
            data/weights/
            data/reports/

      - name: 安装依赖
        run: python -m pip install -r requirements.txt

      - name: 执行每日选股、回填或回测
        id: execution
        env:
          TASK_INPUT: ${{ inputs.task }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            if [[ "$SCHEDULE" == '17 19 * * 0-4' ]]; then
              TASK=backfill
            else
              TASK=pick
            fi
          else
            TASK="${TASK_INPUT:-pick}"
          fi
          echo "task=$TASK" >> "$GITHUB_OUTPUT"
          echo "当前任务：$TASK；北京时间：$(date '+%F %T %Z')"

          case "$TASK" in
            pick)
              python scripts/daily_job.py --time-mode auto
              ;;
            backfill)
              python scripts/backfill_pending.py
              ;;
            backtest)
              START="$(date -d '21 days ago' +%F)"
              END="$(date +%F)"
              python scripts/run_backtest.py --mode short --start "$START" --end "$END" --out "data/reports/backtest_$(date +%Y%m%d).md"
              ;;
            *)
              echo "未知任务：$TASK" >&2
              exit 1
              ;;
          esac

      - name: 可选：发送最新简报到 Telegram
        if: ${{ success() && steps.execution.outputs.task == 'pick' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
       
        run: |
          python - <<'PY'
          import os
          import re
          import time
          from pathlib import Path
          import requests

          token = os.environ.get("TELEGRAM_BOT_TOKEN")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID")

          if not token or not chat_id:
              print("Telegram Secrets 未设置")
              raise SystemExit(0)

          reports = list(Path("data/reports").rglob("*_briefing.md"))
          if not reports:
              print("没有找到今日简报")
              raise SystemExit(0)

          latest = max(reports, key=lambda p: p.stat().st_mtime)
          content = latest.read_text(encoding="utf-8").strip()

          # 将常用 Markdown 标记转换为普通文本
          content = re.sub(r"(?m)^#{1,6}\s*", "", content)
          content = content.replace("**", "").replace("```", "")
          content = re.sub(r"\[([^\]]+)\]\(([^)]+)\)", r"\1（\2）", content)

          # Telegram 单条消息有长度限制，自动拆分
          chunks = [content[i:i+3500] for i in range(0, len(content), 3500)]

          for index, chunk in enumerate(chunks, 1):
              message = f"📈 A股每日选股报告（{index}/{len(chunks)}）\n\n{chunk}"
              response = requests.post(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data={"chat_id": chat_id, "text": message},
                  timeout=30
              )
              response.raise_for_status()
              if not response.json().get("ok"):
                  raise RuntimeError(response.text)
              time.sleep(1.1)

          print("Telegram 文本推送完成")
          PY


      - name: 保存数据库供下次自动运行恢复
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          key: stockpicker-state-${{ github.run_id }}
          path: |
            data/db/
            data/cache/*.db
            data/weights/
            data/reports/

      - name: 备份报告、SQLite 数据库与日志供下载
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: stockpicker-output-${{ github.run_id }}
          path: |
            data/reports/
            data/logs/
            data/db/*.db
            data/cache/*.db
          if-no-files-found: warn
          retention-days: 30
